<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>felx box</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        .container{
            width: 600px ;
            height: 200px;
            background-color: aqua;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: row;
            flex-wrap: wrap;
        }
        .container > .box-1 , .box-2  , .box-3 , .box-4 , .box-5{
            border: 2px solid black;
            border-radius: 10px;
            background-color: antiquewhite;
            margin: 0 10px;
            padding: 10px 25px;
        }
        .box-1{
            order: 1;
        }
        .box-2{
            order: 1;
            flex-grow: 3;
        }
        .box-3{
            order: 1;
            flex-shrink: 2;
        }
        .box-4{
            order:1;
        }
        .box-5{
            order: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box-1">box1</div>
        <div class="box-2">box2</div>
        <div class="box-3">box3</div>
        <div class="box-4">box4</div>
        <div class="box-5">box5</div>
        <!-- <div class="box-4">box6</div>
        <div class="box-5">box7</div> -->
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table lesson</title>
    <style>
        table thead tr , table tbody tr td:first-child{
            background-color: rgb(252, 215, 166);
        }
        table tbody tr:first-child td:nth-child(-n+5)
        {
            opacity: 0.5;
        }
        table tbody tr td{
            border-radius: 20px;
            background-color: aqua;
            outline: 1px solid rgb(3, 7, 231);
            border: 2px solid rgb(99, 99, 99);
            transition: 0.1s ease-in-out;
            &:hover{
                transform: scale(1.1);
            }
            &::after{
                content: '🪷';
            }
        }

    </style>
</head>
<body style ="display: flex; justify-content: center; align-items: center; height: 100vh;   ">
    <table border="1" style ="border-collapse: collapse; width: 500px; height: 200px;">
        <thead>
            <tr style="text-align: center;">
                <th style="padding: 10px;">Sun</th>
                <th style="padding: 10px;">Mon</th>
                <th style="padding: 10px;">Tue</th>
                <th style="padding: 10px;">Wed</th>
                <th style="padding: 10px;">Thu</th>
                <th style="padding: 10px;">Fri</th>
                <th style="padding: 10px;">Sat</th>
            </tr>
        </thead>
        <tbody>
            <tr style="text-align: center;">
                <td style="padding: 10px;">01</td>
                <td style="padding: 10px;">02</td>
                <td style="padding: 10px;">03</td>
                <td style="padding: 10px;">04</td>
                <td style="padding: 10px;">05</td>
                <td style="padding: 10px;">06</td>
                <td style="padding: 10px;">07</td>
            </tr>
            <tr style="text-align: center;">
                <td style="padding: 10px;">08</td>
                <td style="padding: 10px;">09</td>
                <td style="padding: 10px;">10</td>
                <td style="padding: 10px;">11</td>
                <td style="padding: 10px;">12</td>
                <td style="padding: 10px;">13</td>
                <td style="padding: 10px;">14</td>
            </tr>
            <tr style="text-align: center;">
                <td style="padding: 10px;">15</td>
                <td style="padding: 10px;">16</td>
                <td style="padding: 10px;">17</td>
                <td style="padding: 10px;">18</td>
                <td style="padding: 10px;">19</td>
                <td style="padding: 10px;">20</td>
                <td style="padding: 10px;">21</td>
            </tr>
            <tr style="text-align: center;">
                <td style="padding: 10px;">22</td>
                <td style="padding: 10px;">23</td>
                <td style="padding: 10px;">24</td>
                <td style="padding: 10px;">25</td>
                <td style="padding: 10px;">26</td>
                <td style="padding: 10px;">27</td>
                <td style="padding: 10px;">28</td>
            </tr>
            <tr style="text-align: center;">
                <td style="padding: 10px;">29</td>
                <td style="padding: 10px;">30</td>
                <td style="padding: 10px;">31</td>
                <td style="padding: 10px;">01</td>
                <td style="padding: 10px;">30</td>
                <td style="padding: 10px;">02</td>
                <td style="padding: 10px;">03</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
